# [deep-analysis] v0.23.0 — EPLB ON (r0, nixl async) — COLLECT-ONLY (Option A, KHÔNG profiler).
# Mục tiêu: thu ĐỦ 8 file eplb_tokens_rank{0..7}.npz (#tokens per-step per-expert) qua
# /collect_eplb — KHÔNG bật torch profiler nên không có gridlock chặn collective_rpc.
# Time (trace) đo ở run r0.yaml (có profiler) riêng.
env_vars:
  VLLM_MOREH_USE_AITER_MLA_PREFILL: "1"
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_MOREH_SKIP_AITER_FMOE_PATCH: '1'
  VLLM_MOREH_USE_PD_SEPARATION: '1'
  VLLM_MOREH_SCHEDULER_LOGGING: '1'
  VLLM_MOREH_SCHEDULER_LOG_INTERVAL: '0'
  VLLM_SERVER_DEV_MODE: '1'
  VLLM_MOREH_EPLB_TIMING: '1'
  VLLM_MOREH_EPLB_UCX_ERR_MODE: 'none'
  UCX_TLS: tcp,self,sm,rocm_copy,rocm_ipc
parallelism_args:
  tensor_parallel_size: 1
  data_parallel_size: 8
  enable_expert_parallel: true
engine_args:
  # [r0_collect] KHÔNG profiler_config: Option A -> serve KHÔNG torch profiler
  #   -> hết post-bench shm_broadcast gridlock -> /collect_eplb (collective_rpc
  #      DPLB broadcast) tới ĐỦ 8 DP engine rảnh -> 8 npz. Time analysis dùng run profiler riêng.
  trust_remote_code: true
  attention_backend: ROCM_AITER_MLA
  mm_encoder_tp_mode: data
  gpu_memory_utilization: 0.85
  kv_cache_dtype: auto
  enable_prefix_caching: true
  reasoning_parser: kimi_k2
  enable_auto_tool_choice: true
  tool_call_parser: kimi_k2
  scheduler_cls: vllm_moreh.sched.pds_scheduler.PDSLoggingScheduler
  enable_eplb: true
  eplb_config: '{"use_async": true, "communicator": "nixl", "log_balancedness": true, "log_balancedness_interval": 100}'
  # TIME-only (không balancedness overhead): dùng dòng dưới thay dòng trên
  # eplb_config: '{"use_async": true, "communicator": "nixl"}'
