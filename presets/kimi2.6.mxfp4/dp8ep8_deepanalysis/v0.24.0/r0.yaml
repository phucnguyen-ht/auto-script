# [deep-analysis] 0.24 — EPLB ON (r0, nixl async) — LOG ĐỦ 3 TÍN HIỆU trong 1 run:
#   (1) #tokens  : eplb_config.log_balancedness=true, interval=1  -> log "[EPLB balance]" mỗi step
#   (2) time     : profiler_config (torch)                        -> trace 8 rank
#   (3) #experts : log "[EPLB transfer]" (recv_count) LUÔN bật (instrument async_worker, không cần flag)
# Container phuc-nguyen-mv4572-analysis-0.24.0. gpu_mem 0.85. 0.24 base-config: kv fp8_e4m3,
# VLLM_USE_V2_MODEL_RUNNER=1, UCX_TLS CÓ rc_x. (VLLM_MOREH_EPLB_TIMING ở 0.24 KHÔNG được đọc bởi
# async_worker upstream -> giữ để đối xứng preset, nhưng [EPLB transfer] không phụ thuộc nó.)
# CẢNH BÁO: log_balancedness thêm 1 all_reduce mỗi step -> phồng chi phí EPLB trong trace. Muốn đo
#   TIME sạch: dùng dòng eplb_config không balancedness (comment sẵn bên dưới).
env_vars:
  VLLM_MOREH_USE_AITER_MLA_PREFILL: "1"
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOREH_SKIP_AITER_FMOE_PATCH: '1'
  VLLM_MOREH_USE_PD_SEPARATION: '1'
  VLLM_MOREH_SCHEDULER_LOGGING: '1'
  VLLM_MOREH_SCHEDULER_LOG_INTERVAL: '0'
  VLLM_SERVER_DEV_MODE: '1'
  VLLM_MOREH_EPLB_TIMING: '1'
  VLLM_MOREH_EPLB_UCX_ERR_MODE: 'none'
  UCX_TLS: tcp,self,sm,rocm_copy,rocm_ipc,rc_x
parallelism_args:
  tensor_parallel_size: 1
  data_parallel_size: 8
  enable_expert_parallel: true
engine_args:
  profiler_config: '{"profiler":"torch","torch_profiler_dir":"__RUN_PROFILER_DIR__","torch_profiler_with_stack":"False","torch_profiler_record_shapes":"False","torch_profiler_with_memory":"False","torch_profiler_with_flops":"False","ignore_frontend":"True"}'
  trust_remote_code: true
  attention_backend: ROCM_AITER_MLA
  mm_encoder_tp_mode: data
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  enable_prefix_caching: true
  reasoning_parser: kimi_k2
  enable_auto_tool_choice: true
  tool_call_parser: kimi_k2
  scheduler_cls: vllm_moreh.sched.pds_scheduler.PDSLoggingScheduler
  enable_eplb: true
  eplb_config: '{"use_async": true, "communicator": "nixl", "log_balancedness": true, "log_balancedness_interval": 100}'
  # TIME-only (không balancedness overhead): dùng dòng dưới thay dòng trên
  # eplb_config: '{"use_async": true, "communicator": "nixl"}'
