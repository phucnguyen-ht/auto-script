# [phuc-ablation A24] = A23 + MV4572_REORDER_EPLB_STEP=1  (THÍ NGHIỆM QUYẾT ĐỊNH nghi ngờ (1))
# = (step ON) + FIX_A + real nixl comm + use_async=TRUE + norearr + REORDER step về TRƯỚC D2H (giống V1).
# A23 = step ON, decorator fire step SAU AsyncOutput D2H (V2-order) -> kỳ vọng REGRESS.
# A24 = step ON, nhưng fire step TRƯỚC D2H (V1-order) qua MV4572_REORDER_EPLB_STEP.
#   - A24 RECOVER (≈ A20/A22) => ORDERING (step-sau-D2H) LÀ cơ chế regression => CHỐT nghi ngờ (1);
#       fix thật = reorder (giữ EPLB step chạy, chỉ đổi vị trí) — không cần skip step.
#   - A24 vẫn REGRESS (≈ A23) => ordering KHÔNG phải cơ chế; cost của step nằm ở chỗ khác.
# Verify serve.log phải có "[MV-4572 REORDER] eplb.step() fired BEFORE AsyncOutput D2H".
env_vars:
  VLLM_MOREH_USE_AITER_MLA_PREFILL: "1"
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOREH_SKIP_AITER_FMOE_PATCH: '1'
  VLLM_MOREH_USE_PD_SEPARATION: '1'
  VLLM_MOREH_SCHEDULER_LOGGING: '1'
  VLLM_MOREH_SCHEDULER_LOG_INTERVAL: '0'
  VLLM_SERVER_DEV_MODE: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  VLLM_MOREH_EPLB_TIMING: '0'
  VLLM_MOREH_EPLB_UCX_ERR_MODE: 'none'
  UCX_TLS: tcp,self,sm,rocm_copy,rocm_ipc,rc_x
  MV4572_EPLB_GROUP_NO_DEVICE_COMM: "1"
  MV4572_REORDER_EPLB_STEP: "1"
  MV4572_FWDDEV: "1"
  MV4572_FWDDEV_EVERY: "200"
parallelism_args:
  tensor_parallel_size: 1
  data_parallel_size: 8
  enable_expert_parallel: true
engine_args:
  trust_remote_code: true
  attention_backend: ROCM_AITER_MLA
  mm_encoder_tp_mode: data
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  enable_prefix_caching: true
  reasoning_parser: kimi_k2
  enable_auto_tool_choice: true
  tool_call_parser: kimi_k2
  scheduler_cls: vllm_moreh.sched.pds_scheduler.PDSLoggingScheduler
  enable_eplb: true
  eplb_config: '{"use_async": true, "communicator": "nixl", "step_interval": 1000000000}'
