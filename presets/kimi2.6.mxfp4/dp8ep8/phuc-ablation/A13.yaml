# [phuc-ablation A13] CONFIG KHÔNG-REGRESSION: EPLB thật + ĐÚNG 2 fix cho 2 nguồn.
# 2 nguồn regression (đã cô lập §13/§14): (1) kernel REMAP, (2) _EPLB group RCCL device-comm.
# A13 = enable_eplb (EPLB THẬT: layer ON, validate ON, step ON, communicator ON, use_async ON) + norearr
#   + FIX cho CẢ 2 nguồn:
#     - MV4572_SKIP_EPLB_REMAP=1        -> bỏ kernel remap (identity ở norearr nên ĐÚNG). GIỮ layer eplb ON.
#     - MV4572_EPLB_GROUP_NO_DEVICE_COMM=1 -> group functional, KHÔNG RCCL device-comm phụ (FIX A).
# KHÔNG dùng LAYER_OFF: LAYER_OFF làm eplb_state=None -> base_router:189 (if eplb_state is not None) False
#   -> KHÔNG bao giờ tới check skip_remap (base_router:198) => SKIP_REMAP thừa; và LAYER_OFF tắt cả
#   set_eplb_state/eplb-dispatch => KHÔNG phải EPLB thật. Ta muốn layer ON (EPLB structure thật) + chỉ bỏ kernel.
# Kỳ vọng: A13 ≈ A0 (18ms/104, HẾT regress) => CHỐT: 2 fix đủ để EPLB-on @norearr = miễn phí.
#   A13 vẫn regress => còn nguồn khác -> đào (§14.3).
env_vars:
  VLLM_MOREH_USE_AITER_MLA_PREFILL: "1"
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOREH_SKIP_AITER_FMOE_PATCH: '1'
  VLLM_MOREH_USE_PD_SEPARATION: '1'
  VLLM_MOREH_SCHEDULER_LOGGING: '1'
  VLLM_MOREH_SCHEDULER_LOG_INTERVAL: '0'
  VLLM_SERVER_DEV_MODE: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  VLLM_MOREH_EPLB_TIMING: '0'
  VLLM_MOREH_EPLB_UCX_ERR_MODE: 'none'
  UCX_TLS: tcp,self,sm,rocm_copy,rocm_ipc,rc_x
  MV4572_SKIP_EPLB_REMAP: "1"
  MV4572_EPLB_GROUP_NO_DEVICE_COMM: "1"
  MV4572_FWDDEV: "1"
  MV4572_FWDDEV_EVERY: "200"
parallelism_args:
  tensor_parallel_size: 1
  data_parallel_size: 8
  enable_expert_parallel: true
engine_args:
  trust_remote_code: true
  attention_backend: ROCM_AITER_MLA
  mm_encoder_tp_mode: data
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  enable_prefix_caching: true
  reasoning_parser: kimi_k2
  enable_auto_tool_choice: true
  tool_call_parser: kimi_k2
  scheduler_cls: vllm_moreh.sched.pds_scheduler.PDSLoggingScheduler
  enable_eplb: true
  eplb_config: '{"use_async": true, "communicator": "nixl", "step_interval": 1000000000}'
