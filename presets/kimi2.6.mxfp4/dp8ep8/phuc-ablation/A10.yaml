# [phuc-ablation A10] CEILING test — giữ enable_eplb:true nhưng TẮT SẠCH cả 2 tầng + group:
#   - tầng model-layer-forward: MV4572_EPLB_LAYER_OFF  (FusedMoE build EPLB-off)
#   - tầng runner:              MV4572_EPLB_RUNNER_OFF (EPLBController inert: no EplbState / no add_model
#                                                       -> no set_eplb_state/alloc/communicator / no step)
#   - group:                    MV4572_EPLB_SKIP_GROUP (_EPLB=None)
# => MỌI thứ EPLB-driven inert; chỉ còn `enable_eplb:true` "trơ" ở config/model-build.
#   - A10 ~ A0 (req ~104)  => CHỐT: regression 100% nằm trong code EPLB (runner+layer+group). Bisect tiếp:
#       bật lại từng cái (A9=chỉ group, A_runner=chỉ runner...) để tách site.
#   - A10 vẫn regress (~88) => nguồn NGOÀI runner/layer/group: model-build đọc parallel_config.enable_eplb
#       (deepseek_v2.py: num_physical_experts/expert placement) HOẶC engine-arg side-effect. Dig chỗ đó.
# An toàn: RUNNER_OFF -> state=None -> step()/maybe_register_* no-op (không hit assert); layer LAYER_OFF nên
#   không cần set_eplb_state; SKIP_GROUP valid vì không caller get_eplb_group chạy.
env_vars:
  VLLM_MOREH_USE_AITER_MLA_PREFILL: "1"
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOREH_SKIP_AITER_FMOE_PATCH: '1'
  VLLM_MOREH_USE_PD_SEPARATION: '1'
  VLLM_MOREH_SCHEDULER_LOGGING: '1'
  VLLM_MOREH_SCHEDULER_LOG_INTERVAL: '0'
  VLLM_SERVER_DEV_MODE: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  VLLM_MOREH_EPLB_TIMING: '0'
  VLLM_MOREH_EPLB_UCX_ERR_MODE: 'none'
  UCX_TLS: tcp,self,sm,rocm_copy,rocm_ipc,rc_x
  MV4572_EPLB_LAYER_OFF: "1"
  MV4572_EPLB_RUNNER_OFF: "1"
  MV4572_EPLB_SKIP_GROUP: "1"
  MV4572_FWDDEV: "1"
  MV4572_FWDDEV_EVERY: "200"
parallelism_args:
  tensor_parallel_size: 1
  data_parallel_size: 8
  enable_expert_parallel: true
engine_args:
  trust_remote_code: true
  attention_backend: ROCM_AITER_MLA
  mm_encoder_tp_mode: data
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  enable_prefix_caching: true
  reasoning_parser: kimi_k2
  enable_auto_tool_choice: true
  tool_call_parser: kimi_k2
  scheduler_cls: vllm_moreh.sched.pds_scheduler.PDSLoggingScheduler
  enable_eplb: true
  eplb_config: '{"use_async": false, "communicator": "nixl", "step_interval": 1000000000}'
