# [phuc-ablation A5] EPLB ON (config) + NO-REARRANGE (step_interval=1e9) + TẮT MỌI RUNTIME per-forward:
#   MV4572_EPLB_SKIP_VALIDATE + MV4572_SKIP_EPLB_REMAP + MV4572_SKIP_EPLB_STEP.
# Construction VẪN EPLB-armed (eplb_state != None, ExpertMapManager enable_eplb=True) -> chỉ bỏ phần RUNTIME
# (L1 validate + L2 mapping kernel + R step), GIỮ trục C (construction). So A5 vs A6:
#   - A6 recover NHIỀU hơn A5 => phần dư = construction (trục C).
#   - A5 ~ A6 ~ A0            => regression do runtime pieces (mâu thuẫn ablation cũ "nhỏ" -> re-check).
# VALID chỉ vì norearr/identity (SKIP_EPLB_REMAP trả logical=physical). KHÔNG bật khi có rearrange thật.
env_vars:
  VLLM_MOREH_USE_AITER_MLA_PREFILL: "1"
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOREH_SKIP_AITER_FMOE_PATCH: '1'
  VLLM_MOREH_USE_PD_SEPARATION: '1'
  VLLM_MOREH_SCHEDULER_LOGGING: '1'
  VLLM_MOREH_SCHEDULER_LOG_INTERVAL: '0'
  VLLM_SERVER_DEV_MODE: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  VLLM_MOREH_EPLB_TIMING: '0'
  VLLM_MOREH_EPLB_UCX_ERR_MODE: 'none'
  UCX_TLS: tcp,self,sm,rocm_copy,rocm_ipc,rc_x
  MV4572_EPLB_SKIP_VALIDATE: "1"   # [ablation L1] skip _validate_eplb_state (base_router.py:175)
  MV4572_SKIP_EPLB_REMAP: "1"      # [ablation L2] skip mapping kernel   (base_router.py:198)
  MV4572_SKIP_EPLB_STEP: "1"       # [ablation R]  skip eplb.step()      (eplb_utils.py:136 + eplb_state.py:507)
parallelism_args:
  tensor_parallel_size: 1
  data_parallel_size: 8
  enable_expert_parallel: true
engine_args:
  trust_remote_code: true
  attention_backend: ROCM_AITER_MLA
  mm_encoder_tp_mode: data
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  enable_prefix_caching: true
  reasoning_parser: kimi_k2
  enable_auto_tool_choice: true
  tool_call_parser: kimi_k2
  scheduler_cls: vllm_moreh.sched.pds_scheduler.PDSLoggingScheduler
  enable_eplb: true
  # step_interval=1e9 -> KHÔNG bao giờ rearrange (identity map) -> SKIP_EPLB_REMAP an toàn (logical=physical).
  eplb_config: '{"use_async": true, "communicator": "nixl", "step_interval": 1000000000}'
