# [phuc-ablation A0_ucx] CONFOUND CHECK: = A0 (EPLB OFF hoàn toàn) NHƯNG thêm ĐÚNG 3 env mà A5/A6/A6A5
# có thêm so với A0: UCX_TLS + VLLM_MOREH_EPLB_TIMING + VLLM_MOREH_EPLB_UCX_ERR_MODE.
# enable_eplb VẪN = false (KHÔNG EplbState, KHÔNG nixl-EPLB, KHÔNG add_model). Nhưng UCX_TLS là env
# TOÀN-PROCESS -> vẫn tác động NixlConnector PD-KV (VLLM_MOREH_USE_PD_SEPARATION=1) — xem docs/UCX_TLS_global_effect.md.
# Đọc: nếu A0_ucx REGRESS ~ A6/A5/A6A5 (còn A0 thì không) ⇒ regression = confound UCX_TLS (PD-KV), KHÔNG phải EPLB.
#       nếu A0_ucx ~ A0 (không regress) ⇒ UCX_TLS vô can ⇒ regression thật do enable_eplb ZONE-1 presence.
env_vars:
  VLLM_MOREH_USE_AITER_MLA_PREFILL: "1"
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOREH_SKIP_AITER_FMOE_PATCH: '1'
  VLLM_MOREH_USE_PD_SEPARATION: '1'
  VLLM_MOREH_SCHEDULER_LOGGING: '1'
  VLLM_MOREH_SCHEDULER_LOG_INTERVAL: '0'
  VLLM_SERVER_DEV_MODE: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  # 3 env A5/A6 thêm so với A0 — đưa vào đây để tách riêng ảnh hưởng của chúng (enable_eplb vẫn OFF):
  VLLM_MOREH_EPLB_TIMING: '0'
  VLLM_MOREH_EPLB_UCX_ERR_MODE: 'none'
  UCX_TLS: tcp,self,sm,rocm_copy,rocm_ipc,rc_x
parallelism_args:
  tensor_parallel_size: 1
  data_parallel_size: 8
  enable_expert_parallel: true
engine_args:
  trust_remote_code: true
  attention_backend: ROCM_AITER_MLA
  mm_encoder_tp_mode: data
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  enable_prefix_caching: true
  reasoning_parser: kimi_k2
  enable_auto_tool_choice: true
  tool_call_parser: kimi_k2
  scheduler_cls: vllm_moreh.sched.pds_scheduler.PDSLoggingScheduler
