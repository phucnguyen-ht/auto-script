# [phuc-ablation A6] EPLB ON (config) + NO-REARRANGE (step_interval=1e9) + MV4572_EPLB_LAYER_OFF=1.
# Layer build EPLB-OFF (eplb_state=None) dù enable_eplb=true -> TẮT TOÀN BỘ layer-effect (construction + per-forward
# router). Runner vẫn dựng EPLBController (set_eplb_state no-op vì router.eplb_state=None). Trục C (construction).
# Đọc kết quả (so A0 base + A5 runtime-skip):
#   - A6 ~ A0 (recover)          => regression đến từ LAYER (construction).
#   - A6 recover NHIỀU hơn A5    => phần dư = construction (trục C) = root-cause.
#   - A6 vẫn ~ A5 (chưa recover) => KHÔNG phải layer -> nằm ở RUNNER.
# VALID chỉ vì norearr/identity (num_redundant=0, map identity). KHÔNG bật gate này khi có rearrange thật.
env_vars:
  VLLM_MOREH_USE_AITER_MLA_PREFILL: "1"
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOREH_SKIP_AITER_FMOE_PATCH: '1'
  VLLM_MOREH_USE_PD_SEPARATION: '1'
  VLLM_MOREH_SCHEDULER_LOGGING: '1'
  VLLM_MOREH_SCHEDULER_LOG_INTERVAL: '0'
  VLLM_SERVER_DEV_MODE: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '7200'
  VLLM_MOREH_EPLB_TIMING: '0'
  VLLM_MOREH_EPLB_UCX_ERR_MODE: 'none'
  UCX_TLS: tcp,self,sm,rocm_copy,rocm_ipc,rc_x
  MV4572_EPLB_LAYER_OFF: "1"   # [ablation A6] build layer EPLB-off (layer.py:243)
parallelism_args:
  tensor_parallel_size: 1
  data_parallel_size: 8
  enable_expert_parallel: true
engine_args:
  trust_remote_code: true
  attention_backend: ROCM_AITER_MLA
  mm_encoder_tp_mode: data
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  enable_prefix_caching: true
  reasoning_parser: kimi_k2
  enable_auto_tool_choice: true
  tool_call_parser: kimi_k2
  scheduler_cls: vllm_moreh.sched.pds_scheduler.PDSLoggingScheduler
  enable_eplb: true
  # step_interval=1e9 -> counter init 7.5e8, +1/step, KHÔNG bao giờ chạm 1e9 => KHÔNG rearrange (identity map).
  eplb_config: '{"use_async": true, "communicator": "nixl", "step_interval": 1000000000}'
