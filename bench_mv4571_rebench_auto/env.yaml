# mv-4571 rebench-auto (deep-merged on ../env.yaml). Wraps scripts/:
# serve -> run multi_process_test.py verbatim -> extract (RUN_AND_BENCH.md §4).
backends:
  - name: vllm

phases:
  - bench
  # - profile

# concurrencies x datasets = the driver's parallel_threads_range x datasets_range.
bench:
  method: rebench
  rebench:
    runs: 1
    concurrencies: [64]
    datasets: ["100k"]

profile:
  method: rebench
  rebench:
    runs: 1
    concurrencies: [64]
    datasets: ["100k"]
