# mv-4572 overrides (deep-merged on top of ../env.yaml: arrays replace, maps merge).
#
# Accuracy eval for Kimi-K2.6-MXFP4 (dp8ep8):
#   - eval  : gsm8k via the CUSTOM SCRIPT (datasets/gsm8k/gsm8k.py -> lm_eval
#             local-chat-completions, 5-shot, thinking OFF). runs=1.
#   - readable: smoke tests (completion / chat / pychat) + longbench2 (LongBench-v2
#             100k spot-check via check_longbench.sh) to eyeball model outputs.
# Model resolves from the preset family (presets/kimi2.6.mxfp4/... -> model.paths.kimi2.6.mxfp4).
#
#   cd auto-script/bench_mv4572
#   bash run_all.sh                       # base.yaml (no EPLB) — clean accuracy baseline
#   PRESET=kimi2.6.mxfp4/dp8ep8/base-eplb-nixl-async-default-r0.yaml bash run_all.sh   # WITH nixl EPLB
#   RUN_READABLE=0 bash run_all.sh        # eval only   |   RUN_EVAL=0 -> readable only
backends:
  - name: vllm

phases:
  - readable
  - eval

# Kimi-MXFP4 checkpoint path for preset family "kimi2.6.mxfp4" (adds to global model.paths).
# Trailing slash matches the served model name so lm_eval's "model" field is an exact match.
model:
  paths:
    kimi2.6.mxfp4: /remote/vast0/share-mv/amd/Kimi-K2.6-MXFP4/

eval:
  datasets:
    gsm8k:
      runs: 1
      method: script        # datasets/gsm8k/gsm8k.py (chat-completions, 5-shot, thinking off)
  # readable methods to run. longbench2 = LongBench-v2 100k spot-check, ticket-local
  # (bench_mv4572/auto_readable_longbench2.sh -> check_longbench.sh). NOT scored — the
  # custom jsonl has no answer key. Use readable: [longbench2] to run only that.
  readable: [longbench2, pychat]
