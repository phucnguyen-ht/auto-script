# mv-4526 overrides (deep-merged on top of ../env.yaml).
# Benchmark a custom dataset (longbenchv2-custom) via `vllm bench serve`, sweeping
# dataset x request_rate x concurrency. profile = same + --profile.
backends:
  - name: vllm

phases:
  - bench
  - profile

# method: custom -> cross-product of datasets x rates x concurrencies.
# num_prompts = clamp(conc * prompts_per_concurrency, floor, cap).
# Each dataset may drop combos via exclude_concurrencies / exclude_rates.
bench:
  method: custom
  custom:
    runs: 1
    dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
    datasets:
      - { name: 8k,   osl: 1024 }
      - { name: 10k,  osl: 500 }
      - { name: 100k, osl: 500, exclude_concurrencies: [48, 64] }
    rates: [1, 2, inf]
    concurrencies: [8, 16, 32, 48, 64]
    prompts_per_concurrency: 3
    num_prompts_floor: 32
    num_prompts_cap: 256

profile:
  method: custom
  custom:
    runs: 1
    dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
    datasets:
      - { name: 10k, osl: 500 }
    rates: [inf]
    concurrencies: [16]
    prompts_per_concurrency: 1
    num_prompts_floor: 16
    num_prompts_cap: 64
