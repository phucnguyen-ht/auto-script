# mv-4526 overrides (deep-merged on top of ../env.yaml).
# Benchmark a custom dataset (longbenchv2-custom) via `vllm bench serve`, sweeping
# dataset x request_rate x concurrency. profile = same + --profile.
backends:
  - name: vllm

phases:
  # - bench
  - profile

# method: custom -> each dataset lists its own rates x concurrencies.
# num_prompts = clamp(conc * prompts_per_concurrency, floor, cap).
bench:
  method: custom
  custom:
    runs: 3
    dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
    prompts_per_concurrency: 3
    num_prompts_floor: 32
    num_prompts_cap: 256
    datasets:
      # - { name: 8k,   osl: 1024, rates: [1, 2], concurrencies: [8] }
      - { name: 8k,   osl: 1024, rates: [1, 2], concurrencies: [8, 16, 32, 48, 64] }
      # - { name: 10k,  osl: 500,  rates: [1, 2], concurrencies: [8] }
      - { name: 10k,  osl: 500,  rates: [1, 2], concurrencies: [8, 16, 32, 48, 64] }
      # - { name: 100k, osl: 500,  rates: [1, 2], concurrencies: [8,32] }
      - { name: 100k, osl: 500,  rates: [1, 2], concurrencies: [8, 16, 32] }

profile:
  method: custom
  custom:
    runs: 1
    dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
    prompts_per_concurrency: 1
    num_prompts_floor: 32
    num_prompts_cap: 256
    datasets:
      - { name: 10k, osl: 500, rates: [1, 2], concurrencies: [16, 32] }
