# mv-4433 overrides (deep-merged on top of ../env.yaml).
backends:
  - name: vllm
  # - name: sglang
  #   serve_script: bench_mv4433/serve_sglang_ds3.2.sh
  #   model: deepseek

# Phase order (bench/profile are this ticket's; readable/eval are shared).
phases:
  - bench
  - profile
  - readable
  - eval

# bench/profile use this ticket's own auto_bench.sh / auto_profile.sh (custom);
# prompts = list of num-prompts, runs = iters per prompt (mean/std appended).
profile:
  method: custom
  custom: { runs: 1, prompts: [16] }
bench:
  method: custom
  custom: { runs: 3, prompts: [16, 18, 20, 25] }

eval:
  datasets:
    repobench: { runs: 1 }
    mmlu:      { runs: 1 }
    gsm8k:     { runs: 1 }
