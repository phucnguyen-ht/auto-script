# MV-4571 / MV-4572 — testcases cho auto_analyze_ep_imbalance.sh.
# Mỗi case nở ra theo:  (preset của model) x rates x concurrencies.
# Với MỖI tổ hợp (preset, rate, conc) chạy CẢ HAI phân tích token + time,
# mỗi phase serve RIÊNG (kill -> serve -> bench -> analyze -> kill) -> data sạch.
# Phải có dataset: <dataset_dir>/longbenchv2-<name>.jsonl
#
# Matrix lấy từ desc ticket:
#   glm5.2 (MV-4571): ISL{8k,10k,100k,1M}; conc theo ISL; MTP{0,3} -> 2 preset.
#   kimi2.6 (MV-4572): desc CHƯA define rõ -> tạm 1 conc/ISL (=8).

defaults:
  dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
  prompts_per_concurrency: 2     # BENCH (token): num_prompts = clamp(ppc*conc, floor, cap).
  num_prompts_floor: 1           #   PROFILE (time): ppc LUÔN = 1 -> num_prompts = clamp(conc, floor, cap).
  num_prompts_cap: 256

# `model` (trong case) map sang: 1 model_path + 1 list preset.
models:
  glm5.2:                         # MV-4571: MTP 0 + MTP 3 = 2 preset
    model_path: /remote/vast0/share-mv/zai-org/GLM-5.2-FP8
    presets:
      # - glm5.2/dp8ep8/noMTP-bs64-dg.yaml   # MTP 0
      - glm5.2/dp8ep8/MTP5-bs64-dg.yaml    # MTP 5
  kimi2.6:                        # MV-4572
    model_path: /remote/vast0/share-mv/moonshotai/Kimi-K2.6
    presets:
      - kimi2.6/dp8ep8/noMTP.yaml
      - kimi2.6/dp8ep8/MTP3.yaml

cases:
  # ---- glm5.2 (MV-4571) ----
  # - { model: glm5.2, name: 8k,   osl: 1024, rates: ["inf"], concurrencies: [8, 22, 31, 36, 52] }
  # - { model: glm5.2, name: 10k,  osl: 500,  rates: ["inf"], concurrencies: [8, 22, 31, 36, 52] }
  # - { model: glm5.2, name: 100k, osl: 500,  rates: ["inf"], concurrencies: [8, 22, 31, 36] }
  # - { model: glm5.2, name: 1M,   osl: 500,  rates: ["inf"], concurrencies: [8] }

  # ---- kimi2.6 (MV-4572) — tạm 1 conc/ISL (desc chưa define) ----
  # - { model: kimi2.6, name: 8k,   osl: 1024, rates: ["inf"], concurrencies: [8] }
  - { model: kimi2.6, name: 10k,  osl: 500,  rates: ["inf"], concurrencies: [8, 36] }
  - { model: kimi2.6, name: 100k, osl: 500,  rates: ["inf"], concurrencies: [8, 36] }
  # - { model: kimi2.6, name: 1M,   osl: 500,  rates: ["inf"], concurrencies: [8] }
