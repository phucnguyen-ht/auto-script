# EPLB experiment — noMTP @ glm5.2, ISL 10k, conc 36. TIME phase only (PHASES=time).
# baseline (EPLB off) + 3 EPLB-on variants. Compare per-rank MoE-compute TIME imbalance.
defaults:
  dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
  prompts_per_concurrency: 2
  num_prompts_floor: 1
  num_prompts_cap: 256
models:
  glm5.2:
    model_path: /remote/vast0/share-mv/zai-org/GLM-5.2-FP8
    presets:
      - glm5.2/dp8ep8/noMTP-bs64-dg-eplb-freq.yaml       # FIRST: validate EPLB(torch_nccl) init quickly
      - glm5.2/dp8ep8/noMTP-bs64-dg.yaml                 # baseline (EPLB off)
      - glm5.2/dp8ep8/noMTP-bs64-dg-eplb-freq-red16.yaml # win100/step100 + 16 redundant experts
      - glm5.2/dp8ep8/noMTP-bs64-dg-eplb-default.yaml    # win1000/step3000 (likely no rebalance in short run)
cases:
  - { model: glm5.2, name: 10k, osl: 500, rates: ["inf"], concurrencies: [36] }
