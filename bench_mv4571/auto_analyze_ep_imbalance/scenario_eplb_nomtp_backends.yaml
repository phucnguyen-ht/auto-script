# EPLB backend comparison — noMTP @ glm5.2 10k_c36, freq algo (win100/step100, red0), TIME phase.
# Compare communicator backends (torch_nccl already done in run_20260630_183918). pynccl/gloo/nixl here.
defaults:
  dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
  prompts_per_concurrency: 2
  num_prompts_floor: 1
  num_prompts_cap: 256
models:
  glm5.2:
    model_path: /remote/vast0/share-mv/zai-org/GLM-5.2-FP8
    presets:
      - glm5.2/dp8ep8/noMTP-bs64-dg-eplb-freq-pynccl.yaml
      - glm5.2/dp8ep8/noMTP-bs64-dg-eplb-freq-gloo.yaml
      - glm5.2/dp8ep8/noMTP-bs64-dg-eplb-freq-nixl.yaml   # expected to fail (NIXL VRAM reg on ROCm)
cases:
  - { model: glm5.2, name: 10k, osl: 500, rates: ["inf"], concurrencies: [36] }
