# mv-4571 overrides (deep-merged on top of ../env.yaml).
# [GLM5.2] Analyze EP balancing impact (MV-4571). Custom-dataset `vllm bench serve`
# flow. auto_bench.sh is a real concrete (ticket bench knobs: metric-percentiles
# 75,90,99, trust-remote-code, prefix-cache reset off -- see its header).
# auto_profile.sh / run_all.sh are symlinks to ../bench_mv4526/ (generic, no knobs).
#
# Sweep: ISL (longbenchv2-custom file) x concurrency, request_rate=inf
# (saturate to max-concurrency). profile = same sweep + --profile (torch profiler
# -> expert-dispatch traces for the EP-imbalance analysis).
#
# NO warmup + prefix caching DISABLED: both glm5.2 presets carry
# engine_args.enable_prefix_caching: false, so every conc is measured cold with no
# /reset_prefix_cache step. See run_all_full_presets_vllm.sh for the two presets.
#
# Model: glm5.2, resolved from the preset family (presets/glm5.2/...). The two
# MTP directions are two presets, run by run_all_full_presets_vllm.sh:
#   presets/glm5.2/dp8ep8/noMTP-bs64-dg.yaml  (MTP 0)
#   presets/glm5.2/dp8ep8/MTP3-bs64-dg.yaml   (MTP 3)
backends:
  - name: vllm

phases:
  - bench
  # - profile

# method: custom -> each dataset (ISL) lists its own concurrencies.
# num_prompts = clamp(conc * 2, 1, 256) = 2*conc here -- stays within each file's
# unique-prompt pool (8k/10k<=256, 100k<=100, 1M<=22). OSL = manifest
# recommended_osl (8k:1024, 10k/100k/1M:500). rate=inf -> no rate axis.
bench:
  method: custom
  custom:
    runs: 3
    dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
    prompts_per_concurrency: 2
    num_prompts_floor: 1
    num_prompts_cap: 256
    datasets:
      - { name: 8k,   osl: 1024, rates: ["inf"], concurrencies: [8, 22, 31, 36, 52] }
      - { name: 10k,  osl: 500,  rates: ["inf"], concurrencies: [8, 22, 31, 36, 52] }
      - { name: 100k, osl: 500,  rates: ["inf"], concurrencies: [8, 22, 31, 36] }
      - { name: 1M,   osl: 500,  rates: ["inf"], concurrencies: [8] }

profile:
  method: custom
  custom:
    runs: 1
    dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
    prompts_per_concurrency: 2
    num_prompts_floor: 1
    num_prompts_cap: 256
    datasets:
      - { name: 8k,   osl: 1024, rates: ["inf"], concurrencies: [8, 22, 31, 36, 52] }
      - { name: 10k,  osl: 500,  rates: ["inf"], concurrencies: [8, 22, 31, 36, 52] }
      - { name: 100k, osl: 500,  rates: ["inf"], concurrencies: [8, 22, 31, 36] }
      - { name: 1M,   osl: 500,  rates: ["inf"], concurrencies: [8] }
