# EPLB Phase-3 verification bench env (deep-merged on top of ../env.yaml).
# 3 bench runs (mean/std), 10k @ conc 36, rate inf. NO profiler (true performance) -> MODE=bench.
# Usage: PRESET=glm5.2/dp8ep8/<preset>.yaml ENV_YAML=<this> bash auto_bench.sh
backends:
  - name: vllm
phases:
  - bench
bench:
  method: custom
  custom:
    runs: 3
    dataset_dir: /remote/vast0/share-mv/longbenchv2-custom
    prompts_per_concurrency: 2
    num_prompts_floor: 1
    num_prompts_cap: 256
    datasets:
      - { name: 10k, osl: 500, rates: ["inf"], concurrencies: [36] }
