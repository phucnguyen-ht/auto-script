# Global defaults / base config. A ticket's env.yaml is deep-merged ON TOP of
# this (arrays replace, maps merge), so a ticket only lists what it changes —
# usually just `backends` and the `eval.datasets.*.runs` it wants.

# run_all.sh iterates this list (by .name). bench/profile are vLLM-only.
# vLLM derives its model from the preset family. sglang has no preset, so its
# entry must give a serve_script (relative to auto-script/) and a model key
# (-> model.paths.<model>). serve_script is ticket-specific, so enable sglang in
# the ticket env.yaml.
backends:
  - name: vllm
  # - name: sglang
  #   serve_script: bench_mv4433/serve_sglang_ds3.2.sh
  #   model: deepseek

model:
  # Family = preset's top-level presets/ subfolder (presets/<family>/...).
  paths:
    glm5:     /remote/vast0/share-mv/zai-org/GLM-5-FP8
    deepseek: /remote/vast0/share-mv/deepseek-ai/DeepSeek-V3.2
    kimi2.6:  /remote/vast0/share-mv/moonshotai/Kimi-K2.6

# profile/bench: defined per-ticket. method: random (common vllm bench serve) |
# custom (ticket-defined). Params under a sub-key named by the method. runs =
# repeats; the run-major loop runs each scenario `runs` times -> mean/std.
#   random: scenarios = list of {isl, osl, conc, prompt}
#   custom: prompts = list of num-prompts
profile:
  config:                       # torch profiler flags
    TORCH_PROFILER_WITH_STACK: "False"
    TORCH_PROFILER_RECORD_SHAPES: "False"
    TORCH_PROFILER_WITH_MEMORY: "False"
    TORCH_PROFILER_WITH_FLOPS: "False"
  # method: random
  # random:
  #   runs: 1
  #   scenarios:
  #     - { isl: 8192, osl: 256, conc: 16, prompt: 16 }
# bench:
#   method: random
#   random:
#     runs: 1
#     scenarios:
#       - { isl: 8192, osl: 256, conc: 16, prompt: 16 }

eval:
  # runs = number of times to run (0 = skip). All off by default; tickets opt in.
  # Paths are relative to auto-script/ (datasets/ holds datasets needing a repo).
  datasets:
    repobench:
      runs: 0
      dataset_path: datasets/repobench/repobench_65k.json
      repobench_dir: datasets/repobench/repobench
    mmlu:       { runs: 0 }
    gsm8k:
      runs: 0
      method: lm_eval      # lm_eval (standard) | script (datasets/gsm8k/gsm8k.py)
    longbench:  { runs: 0 }
    longbench2: { runs: 0 }
  # readable smoke tests to run (filter). completion = /v1/completions raw;
  # chat = /v1/chat/completions; pychat = client-side chat template -> /v1/completions.
  readable: [completion, chat, pychat]
