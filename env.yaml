model:
  # Default model path — used when a preset is not under a known family folder
  # (e.g. running a child script standalone, or an absolute/external preset).
  path: /remote/vast0/share-mv/zai-org/GLM-5-FP8
  # Per-family model paths. run_all.sh derives the family from the top-level
  # presets/ subfolder of the chosen preset (presets/<family>/...) and exports
  # MODEL_PATH = model.paths.<family>, falling back to model.path above.
  paths:
    glm5:     /remote/vast0/share-mv/zai-org/GLM-5-FP8
    deepseek: /remote/vast0/share-mv/deepseek-ai/DeepSeek-V3.2

profiler:
  TORCH_PROFILER_WITH_STACK: "False"
  TORCH_PROFILER_RECORD_SHAPES: "False"
  TORCH_PROFILER_WITH_MEMORY: "False"
  TORCH_PROFILER_WITH_FLOPS: "False"

eval:
  datasets:
    repobench: 1
    mmlu: 1
    gsm8k: 1
    
    longbench: 0
    longbench2: 0

