# Global defaults / base config. A ticket's env.yaml is deep-merged ON TOP of
# this (arrays replace, maps merge), so a ticket only lists what it changes —
# usually just `backends` and the `eval.datasets.*.runs` it wants.

# run_all.sh iterates this list. bench/profile are vLLM-only (skipped for sglang).
backends:
  - vllm
  # - sglang

model:
  # Family = preset's top-level presets/ subfolder (presets/<family>/...).
  paths:
    glm5:     /remote/vast0/share-mv/zai-org/GLM-5-FP8
    deepseek: /remote/vast0/share-mv/deepseek-ai/DeepSeek-V3.2

profiler:
  TORCH_PROFILER_WITH_STACK: "False"
  TORCH_PROFILER_RECORD_SHAPES: "False"
  TORCH_PROFILER_WITH_MEMORY: "False"
  TORCH_PROFILER_WITH_FLOPS: "False"

eval:
  # runs = number of times to run (0 = skip). All off by default; tickets opt in.
  # Paths are relative to auto-script/ (datasets/ holds datasets needing a repo).
  datasets:
    repobench:
      runs: 0
      dataset_path: datasets/repobench/repobench_65k.json
      repobench_dir: datasets/repobench/repobench
    mmlu:       { runs: 0 }
    gsm8k:      { runs: 0 }
    longbench:  { runs: 0 }
    longbench2: { runs: 0 }
